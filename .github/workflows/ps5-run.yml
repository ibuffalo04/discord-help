name: vinted-ps5-controller

on:
  schedule:
    # Keep the PS5 background schedule separate from Xbox.
    - cron: '47 */4 * * *'

  workflow_dispatch:
    inputs:
      handoff_count:
        description: 'Internal Cloudflare handoff counter'
        required: false
        default: '0'
        type: string

# PS5 has its OWN queue.
# Manual/scheduled/replacement PS5 runs stack rather than
# cancelling the current PS5 scanner.
#
# Because the group is different from the Xbox scanner,
# PS5 can run alongside Xbox without slowing or queueing it.
concurrency:
  group: vinted-ps5-scanner
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest

    # Same behaviour as Xbox:
    # 55 minutes scanning + a few minutes for setup/state saving.
    timeout-minutes: 60

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install requests

      # Restore the latest PS5-only state.
      # This remains separate from Xbox state.
      - name: Restore PS5 scanner state
        id: ps5-state-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            vinted_ps5_seen_ids.json
            vinted_ps5_runner_stats.json
          key: vinted-ps5-state-${{ github.run_id }}
          restore-keys: |
            vinted-ps5-state-

      - name: Run PS5 Vinted scanner for 55 minutes
        id: scanner
        shell: bash
        run: |
          set -o pipefail

          python vinted_ps5_alert.py | tee vinted_ps5_scanner.log
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      # Save the PS5 seen IDs / telemetry before any Cloudflare handoff.
      - name: Save PS5 scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            vinted_ps5_seen_ids.json
            vinted_ps5_runner_stats.json
          key: vinted-ps5-state-${{ github.run_id }}

      - name: Queue replacement after Cloudflare challenge
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          # Normal manual/scheduled runs begin at zero.
          # Automatic Cloudflare replacements increment it.
          HANDOFF_COUNT: ${{ github.event.inputs.handoff_count || '0' }}

          # Same safety limit as Xbox.
          MAX_AUTO_HANDOFFS: '3'

        run: |
          if [ ! -f vinted_ps5_scanner.log ]; then
            echo "No PS5 scanner log found."
            exit 0
          fi

          if ! grep -Fq "Cloudflare challenge confirmed." vinted_ps5_scanner.log; then
            echo "No Cloudflare challenge detected."
            echo "No replacement PS5 run needed."
            exit 0
          fi

          echo "Cloudflare challenge detected."

          CURRENT_HANDOFF="${HANDOFF_COUNT:-0}"

          if ! [[ "$CURRENT_HANDOFF" =~ ^[0-9]+$ ]]; then
            CURRENT_HANDOFF=0
          fi

          if [ "$CURRENT_HANDOFF" -ge "$MAX_AUTO_HANDOFFS" ]; then
            echo "Automatic handoff limit reached."
            echo "No additional PS5 run will be queued."
            exit 0
          fi

          NEXT_HANDOFF=$((CURRENT_HANDOFF + 1))

          echo "Automatic PS5 handoff ${NEXT_HANDOFF}/${MAX_AUTO_HANDOFFS}"

          WORKFLOW_FILE="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/.github/workflows/}"
          WORKFLOW_FILE="${WORKFLOW_FILE%@*}"

          echo "Dispatching workflow: ${WORKFLOW_FILE}"

          BODY=$(printf \
            '{"ref":"main","inputs":{"handoff_count":"%s"}}' \
            "$NEXT_HANDOFF"
          )

          HTTP_STATUS=$(curl \
            -sS \
            -L \
            -o /tmp/ps5_workflow_dispatch_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "$BODY"
          )

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Replacement PS5 Vinted scanner successfully queued."
          else
            echo "Failed to queue replacement PS5 scanner."
            echo "GitHub API returned HTTP ${HTTP_STATUS}."

            if [ -s /tmp/ps5_workflow_dispatch_response.json ]; then
              cat /tmp/ps5_workflow_dispatch_response.json
            fi

            exit 1
          fi