name: discord-help

on:
  schedule:
    # Start once every hour at 17 minutes past the hour
    - cron: '17 * * * *'

  push:
    branches:
      - main

  workflow_dispatch:

# Never allow two Vinted scanners to run at the same time.
# If a manual run is already running when the scheduled
# run arrives, the new run waits instead of overlapping.
concurrency:
  group: vinted-scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    # Gives the 55-minute Python process enough time for
    # setup and saving the seen IDs afterwards.
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run Vinted scanner for 55 minutes
        run: python vinted_discord_alert.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

      - name: Save seen IDs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add vinted_seen_ids.json || true

          if ! git diff --cached --quiet; then
            git commit -m "Update seen IDs (automated loop)"
            git push || true
          fi