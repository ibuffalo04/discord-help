name: discord-help

on:
  schedule:
    # Start once every hour at 17 minutes past the hour
    - cron: '17 * * * *'

  push:
    branches:
      - main

    # The scanner updates this file automatically.
    # Don't start another 55-minute run just because
    # the seen-ID state was saved.
    paths-ignore:
      - 'vinted_seen_ids.json'

  workflow_dispatch:

# Only one Vinted scanner may run at once.
# Additional manual/scheduled runs wait in a queue
# instead of replacing each other.
concurrency:
  group: vinted-scanner
  cancel-in-progress: false
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest

    # Python scans for 55 minutes.
    # This leaves a few minutes for setup and saving state.
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Always start queued runs from the latest version
          # of main, including the latest seen IDs.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run Vinted scanner for 55 minutes
        run: python vinted_discord_alert.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

      - name: Save seen IDs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add vinted_seen_ids.json || true

          if ! git diff --cached --quiet; then
            git commit -m "Update seen IDs (automated loop)"
            git push || true
          fi